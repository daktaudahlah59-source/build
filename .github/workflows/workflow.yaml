name: Build APK

on:
  push:
    branches:
      - build

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies (ImageMagick, jq, unzip, curl)
        run: sudo apt-get update && sudo apt-get install -y imagemagick jq unzip curl

      - name: Install Gradle
        run: |
          curl -s "https://get.sdkman.io" | bash
          source "$HOME/.sdkman/bin/sdkman-init.sh"
          sdk install gradle 8.9
          sdk use gradle 8.9
          gradle --version

      - name: Read build config
        id: config
        run: |
          if [ -f build-config.json ]; then
            echo "type=$(jq -r .type build-config.json)" >> $GITHUB_ENV
            echo "url=$(jq -r .url build-config.json)" >> $GITHUB_ENV
            echo "app_name=$(jq -r .app_name build-config.json)" >> $GITHUB_ENV
            echo "build_type=$(jq -r .build_type build-config.json)" >> $GITHUB_ENV
            cat build-config.json
          else
            echo "type=unknown" >> $GITHUB_ENV
          fi

      - name: Generate keystore for signing (all builds)
        run: |
          keytool -genkey -v -keystore release.keystore -alias release -keyalg RSA -keysize 2048 -validity 10000 -storepass password -keypass password -dname "CN=BuildBot, OU=Dev, O=BuildBot, L=City, S=State, C=ID"

      # ---------- Web2APK ----------
      - name: Web2APK - Create root gradle files
        if: env.type == 'web2apk'
        run: |
          mkdir -p project
          cat > project/build.gradle <<EOF
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.7.3'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          task clean(type: Delete) {
              delete rootProject.buildDir
          }
          EOF
          cat > project/settings.gradle <<EOF
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MyApp"
          include ':app'
          EOF
          cat > project/gradle.properties <<EOF
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

      - name: Web2APK - Create app/build.gradle
        if: env.type == 'web2apk'
        run: |
          mkdir -p project/app
          cat > project/app/build.gradle <<EOF
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.web2apk.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.web2apk.app"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              signingConfigs {
                  debug {
                      storeFile file("debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
                  release {
                      storeFile file("debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
              buildTypes {
                  debug { signingConfig signingConfigs.debug }
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.9.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.8.0'
              implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
              implementation 'androidx.webkit:webkit:1.4.0'
          }
          EOF

      - name: Web2APK - Create Java source files
        if: env.type == 'web2apk'
        run: |
          mkdir -p project/app/src/main/java/com/web2apk/app
          cat > project/app/src/main/java/com/web2apk/app/MainActivity.java <<'JAVA_EOF'
          package com.web2apk.app;
          import android.annotation.SuppressLint;
          import android.app.DownloadManager;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Environment;
          import android.view.View;
          import android.webkit.CookieManager;
          import android.webkit.DownloadListener;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.ProgressBar;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.appcompat.widget.Toolbar;
          import androidx.swiperefreshlayout.widget.SwipeRefreshLayout;
          public class MainActivity extends AppCompatActivity {
              private static final String WEBSITE_URL = "URL_PLACEHOLDER";
              private WebView webView;
              private ProgressBar progressBar;
              private SwipeRefreshLayout swipeRefreshLayout;
              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  webView = findViewById(R.id.webView);
                  progressBar = findViewById(R.id.progressBar);
                  swipeRefreshLayout = findViewById(R.id.swipeRefreshLayout);
                  Toolbar toolbar = findViewById(R.id.toolbar);
                  setSupportActionBar(toolbar);
                  if (getSupportActionBar() != null) {
                      getSupportActionBar().setTitle(getString(R.string.app_name));
                  }
                  setupWebView();
                  swipeRefreshLayout.setOnRefreshListener(() -> webView.reload());
                  webView.loadUrl(WEBSITE_URL);
              }
              @SuppressLint("SetJavaScriptEnabled")
              private void setupWebView() {
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  CookieManager.getInstance().setAcceptCookie(true);
                  CookieManager.getInstance().setAcceptThirdPartyCookies(webView, true);
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          progressBar.setVisibility(View.GONE);
                      }
                      @Override
                      public void onPageStarted(WebView view, String url, android.graphics.Bitmap favicon) {
                          super.onPageStarted(view, url, favicon);
                          progressBar.setVisibility(View.VISIBLE);
                      }
                  });
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onProgressChanged(WebView view, int newProgress) {
                          super.onProgressChanged(view, newProgress);
                          progressBar.setProgress(newProgress);
                      }
                  });
                  webView.setDownloadListener((url, userAgent, contentDisposition, mimetype, contentLength) -> {
                      DownloadManager.Request request = new DownloadManager.Request(Uri.parse(url));
                      request.allowScanningByMediaScanner();
                      request.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                      request.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, "download");
                      DownloadManager dm = (DownloadManager) getSystemService(DOWNLOAD_SERVICE);
                      if (dm != null) dm.enqueue(request);
                  });
              }
          }
          JAVA_EOF

      - name: Web2APK - Create XML files
        if: env.type == 'web2apk'
        run: |
          mkdir -p project/app/src/main/res/layout
          mkdir -p project/app/src/main/res/values
          mkdir -p project/app/src/main/res/mipmap-hdpi
          mkdir -p project/app/src/main/res/mipmap-mdpi
          mkdir -p project/app/src/main/res/mipmap-xhdpi
          mkdir -p project/app/src/main/res/mipmap-xxhdpi
          
          # Create layout
          cat > project/app/src/main/AndroidManifest.xml <<'XML_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <application>
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          XML_EOF

      # ---------- FLUTTER ----------
      - name: Check if Flutter project exists
        if: env.type == 'flutter'
        run: |
          if [ -d flutter-project ]; then
            echo "✅ Flutter project found"
          else
            if [ -f pubspec.yaml ]; then
              echo "⚠️ pubspec.yaml found at root, treating as flutter project"
              mkdir -p flutter-project
              cp -R . flutter-project/
            else
              echo "❌ No Flutter project found"
              exit 1
            fi
          fi

      - name: Check and handle Flutter icons (TOLERANT MODE)
        if: env.type == 'flutter'
        run: |
          cd flutter-project
          
          # Define mipmap sizes
          MIPMAP_DIRS="mipmap-hdpi mipmap-mdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi"
          
          # Check if build-assets/icon.png exists
          if [ ! -f ../build-assets/icon.png ]; then
            echo "⚠️ ⚠️ ⚠️ PROJECT INCOMPLETE ⚠️ ⚠️ ⚠️"
            echo ""
            echo "❌ Missing required file: build-assets/icon.png"
            echo ""
            echo "ℹ️ This is NOT a system error. Your project ZIP is incomplete."
            echo "ℹ️ Required file not found in uploaded project:"
            echo "   → build-assets/icon.png (512x512 PNG)"
            echo ""
            echo "📝 How to fix:"
            echo "   1. Ensure your Flutter project has: build-assets/icon.png"
            echo "   2. This file should be a 512x512 PNG image"
            echo "   3. Re-upload your project with this file included"
            echo ""
            echo "ℹ️ The build will continue WITHOUT custom icons (system default will be used)"
            echo ""
            touch /tmp/icon_missing_flag
          else
            echo "✅ Found build-assets/icon.png, generating app icons..."
            
            # Remove existing icons
            for dir in $MIPMAP_DIRS; do
              rm -f android/app/src/main/res/$dir/ic_launcher.*
            done
            
            # Create icon directories
            for dir in $MIPMAP_DIRS; do
              mkdir -p android/app/src/main/res/$dir
            done
            
            # Generate icons with proper error handling
            set +e
            
            convert ../build-assets/icon.png -resize 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher.png 2>/dev/null
            if [ $? -ne 0 ]; then
              echo "⚠️ Failed to generate hdpi icon, skipping..."
            else
              cp android/app/src/main/res/mipmap-hdpi/ic_launcher.png android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
            fi
            
            convert ../build-assets/icon.png -resize 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher.png 2>/dev/null
            if [ $? -ne 0 ]; then
              echo "⚠️ Failed to generate mdpi icon, skipping..."
            else
              cp android/app/src/main/res/mipmap-mdpi/ic_launcher.png android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
            fi
            
            convert ../build-assets/icon.png -resize 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher.png 2>/dev/null
            if [ $? -ne 0 ]; then
              echo "⚠️ Failed to generate xhdpi icon, skipping..."
            else
              cp android/app/src/main/res/mipmap-xhdpi/ic_launcher.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
            fi
            
            convert ../build-assets/icon.png -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png 2>/dev/null
            if [ $? -ne 0 ]; then
              echo "⚠️ Failed to generate xxhdpi icon, skipping..."
            else
              cp android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
            fi
            
            convert ../build-assets/icon.png -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png 2>/dev/null
            if [ $? -ne 0 ]; then
              echo "⚠️ Failed to generate xxxhdpi icon, skipping..."
            else
              cp android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
            fi
            
            set -e
            echo "✅ Icons processed (some may have been skipped due to errors)"
          fi

      - name: Setup Flutter
        if: env.type == 'flutter'
        run: |
          git clone https://github.com/flutter/flutter.git -b stable --depth 1 ~/flutter
          export PATH="$PATH:~/flutter/bin"
          flutter config --no-analytics
          flutter --version

      - name: Flutter pub get with auto-fix
        if: env.type == 'flutter'
        run: |
          export PATH="$PATH:~/flutter/bin"
          cd flutter-project
          
          PUB_LOG="/tmp/pub_get.log"
          MAX_RETRIES=3
          RETRY_COUNT=0
          SUCCESS=false
          
          # Function to auto-fix pubspec issues
          auto_fix_pubspec() {
            local FIXED=false
            echo "=== Attempting to fix pubspec.yaml ==="
            
            # Common fixes for SDK version issues
            sed -i -E "s/sdk:[[:space:]]*['\"]?[^'\"]+['\"]?/sdk: \">=3.6.0 <4.0.0\"/g" pubspec.yaml || true
            FIXED=true
            
            echo "✅ Applied SDK constraint fixes"
            rm -f pubspec.lock
          }
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ] && [ "$SUCCESS" = false ]; do
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "=== Pub get attempt $RETRY_COUNT/$MAX_RETRIES ==="
            
            if flutter pub get 2>&1 | tee "$PUB_LOG"; then
              SUCCESS=true
              echo "✅ flutter pub get succeeded"
              break
            else
              echo "❌ flutter pub get failed"
              if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                auto_fix_pubspec
              fi
            fi
          done
          
          if [ "$SUCCESS" = false ]; then
            echo "⚠️ flutter pub get failed after retries, but continuing..."
            # Don't exit, allow build to continue
          fi

      - name: Flutter build APK (TOLERANT MODE)
        if: env.type == 'flutter'
        run: |
          export PATH="$PATH:~/flutter/bin"
          cd flutter-project
          
          BUILD_MODE="${{ env.build_type }}"
          if [ -z "$BUILD_MODE" ] || [ "$BUILD_MODE" = "null" ]; then
            BUILD_MODE="release"
          fi
          
          echo "Building Flutter APK in $BUILD_MODE mode..."
          
          # Try build with various fallback modes
          if [ "$BUILD_MODE" = "release" ]; then
            if flutter build apk --release 2>&1; then
              echo "✅ Release build succeeded"
            else
              echo "⚠️ Release build failed, trying debug mode..."
              if flutter build apk --debug 2>&1; then
                echo "✅ Debug build succeeded (fallback)"
              else
                echo "❌ Both release and debug builds failed"
                exit 1
              fi
            fi
          else
            if flutter build apk --debug 2>&1; then
              echo "✅ Debug build succeeded"
            else
              echo "❌ Debug build failed"
              exit 1
            fi
          fi
          
          # Check if APK was created
          if find build/app/outputs/flutter-apk -name "*.apk" | head -n 1 | grep -q .; then
            echo "✅ APK generated successfully"
          else
            echo "❌ APK not found in expected location"
            exit 1
          fi

      - name: Verify Flutter APK signature
        if: env.type == 'flutter' && env.build_type == 'release'
        continue-on-error: true
        run: |
          export PATH="$PATH:~/flutter/bin"
          APK_PATH=$(find flutter-project/build/app/outputs/flutter-apk -name "*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            echo "Verifying Flutter APK signature..."
            $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -n1)/apksigner verify "$APK_PATH"
          else
            echo "⚠️ APK not found for signature verification (continuing anyway)"
          fi

      # ---------- UPLOAD ----------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: |
            project/app/build/outputs/apk/release/*.apk
            flutter-project/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn

      - name: Build Summary
        if: always()
        run: |
          echo ""
          echo "════════════════════════════════════════"
          echo "BUILD SUMMARY"
          echo "════════════════════════════════════════"
          
          # Check for icon warning flag
          if [ -f /tmp/icon_missing_flag ]; then
            echo "⚠️  INCOMPLETE PROJECT:"
            echo "   Missing: build-assets/icon.png"
            echo "   Status: Build continued without custom icons"
            echo ""
            echo "💡 Tip: To use custom icons, include build-assets/icon.png in your project"
            echo ""
          fi
          
          echo "Project Type: ${{ env.type }}"
          echo "Build Type: ${{ env.build_type }}"
          echo ""
          
          # List generated APKs
          echo "Generated APK(s):"
          find . -name "*.apk" -type f 2>/dev/null | while read apk; do
            size=$(du -h "$apk" | cut -f1)
            echo "  ✓ $apk ($size)"
          done
          
          echo "════════════════════════════════════════"
