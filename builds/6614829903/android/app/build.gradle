plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.nullx.pp"
    compileSdk 36
    
    // Versi NDK sesuai permintaan plugin lo
    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = "11"
    }

    defaultConfig {
        applicationId "com.nullx.pp"
        minSdk 23
        targetSdk 35
        versionCode flutter.versionCode
        versionName flutter.versionName
        multiDexEnabled true
    }

    signingConfigs {
        debug {
            // Fix: Cek apakah file keystore ada sebelum mencoba membacanya
            def keystoreFile = file('debug.keystore')
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        release {
            // Fix: Gunakan signing config hanya jika keystore ditemukan
            if (signingConfigs.debug.storeFile != null) {
                signingConfig signingConfigs.debug
            }
            
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        debug {
            if (signingConfigs.debug.storeFile != null) {
                signingConfig signingConfigs.debug
            }
        }
    }
    
    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation('io.socket:socket.io-client:2.1.0') {
        exclude group: 'org.json', module: 'json'
    }
    
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.multidex:multidex:2.0.1"

    // Library untuk desugaring
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"
}

flutter {
    source "../.."
}


// Automatically normalize launcher resources before Android resource compilation.
import javax.imageio.ImageIO

tasks.register("fixLauncherImages") {
    doLast {
        def resDir = file("$projectDir/src/main/res")
        fileTree(resDir) {
            include "mipmap-*/ic_launcher.png"
        }.files.each { imageFile ->
            def image = ImageIO.read(imageFile)
            if (image == null) {
                throw new GradleException("Cannot read launcher image: ${imageFile}")
            }

            def format = ImageIO.createImageInputStream(imageFile).withCloseable { input ->
                def readers = ImageIO.getImageReaders(input)
                if (!readers.hasNext()) return null
                def reader = readers.next()
                try {
                    return reader.formatName
                } finally {
                    reader.dispose()
                }
            }

            if (!"png".equalsIgnoreCase(format)) {
                println("Converting ${imageFile} (${format}) -> PNG")
                def tempFile = new File(imageFile.parentFile, "${imageFile.name}.tmp")
                if (!ImageIO.write(image, "png", tempFile)) {
                    throw new GradleException("Failed to convert ${imageFile}")
                }
                if (!imageFile.delete() || !tempFile.renameTo(imageFile)) {
                    throw new GradleException("Failed to replace ${imageFile}")
                }
            }
        }
    }
}

tasks.named("preBuild") {
    dependsOn("fixLauncherImages")
}
